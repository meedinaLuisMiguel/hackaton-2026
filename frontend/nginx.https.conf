server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/dev.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    client_max_body_size 10m;
    add_header Permissions-Policy "microphone=(self)" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/voice/transcribe {
        client_max_body_size 1m;
        proxy_request_buffering off;
        proxy_pass http://backend:8000/api/voice/transcribe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
