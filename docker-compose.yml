services:
  ollama:
    build: ./ollama
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    networks: [internal, public]
    depends_on:
      ollama:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks: [public]
    depends_on:
      - backend

networks:
  internal:
    internal: true
  public: